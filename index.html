<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firebreak CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ground:#faf8f5; --surface:#fff; --line:#ece7df; --line2:#e8e3db;
  --ink:#14120f; --body:#4a443b; --muted:#6b6459; --dim:#8a8175;
  --accent:#b0492a; --accent2:#8f3a20; --green:#2f8f5b; --blue:#4a6fa8;
  --purple:#8557a0; --amber:#a8701f; --grey:#cfc8bd;
}
body{background:var(--ground);color:var(--ink);font:15px/1.55 Manrope,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.disp{font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif}
.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}
a{color:var(--accent);text-decoration:none} a:hover{color:var(--accent2)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:0 28px}
header{border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:20}
.bar{display:flex;align-items:center;justify-content:space-between;padding:15px 0;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px}
.brand span{font-size:17px;font-weight:600;letter-spacing:-.02em}
nav{display:flex;gap:3px;flex-wrap:wrap}
nav button{padding:7px 14px;border-radius:8px;font-size:13.5px;color:var(--muted)}
nav button:hover{background:var(--ground);color:var(--ink)}
nav button.on{background:var(--ink);color:var(--ground);font-weight:500}
.pill{font-size:11px;padding:6px 12px;border:1px solid var(--line2);border-radius:100px;color:var(--muted);background:var(--ground)}
main{padding:26px 0 70px}
h1{font-size:27px;font-weight:600;letter-spacing:-.025em;font-family:"Bricolage Grotesque",sans-serif}
.sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 17px}
.stat .k{font-size:11px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.stat .v{font-size:25px;font-weight:600;margin-top:4px;font-family:"Bricolage Grotesque",sans-serif}
.stat .n{font-size:11px;color:var(--muted);margin-top:2px;font-family:"JetBrains Mono",monospace}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input{padding:7px 11px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);font-size:13px}
.filters input{min-width:220px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.05em;color:var(--dim);text-transform:uppercase;padding:11px 16px;background:#f7f4ef;border-bottom:1px solid var(--line);font-weight:500}
td{padding:11px 16px;border-bottom:1px solid #f2eee7;font-size:13.5px}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:#f7f4ef}
tbody tr:last-child td{border-bottom:none}
.bn{font-weight:600}
.bs{font-size:10.5px;color:var(--dim);font-family:"JetBrains Mono",monospace;margin-top:2px}
.sc{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;font-size:11px;font-weight:600;font-family:"JetBrains Mono",monospace}
.sc1{background:var(--accent);color:#fff} .sc2{background:var(--grey);color:var(--ink)} .sc3{background:#eef0ec;color:var(--muted)}
.tag{font-size:10.5px;padding:3px 8px;border-radius:5px;font-family:"JetBrains Mono",monospace;white-space:nowrap}
.t-nowhere{background:#fbeeea;color:var(--accent)} .t-messenger,.t-social_profile{background:#f0edf5;color:var(--purple)}
.t-form,.t-booking{background:#eef2f8;color:var(--blue)} .t-phone,.t-null{background:#f4f1ec;color:var(--muted)}
.v-validated{background:#eaf5ee;color:var(--green)} .v-disputed{background:#fbeeea;color:var(--accent)}
.v-partial{background:#fdf3e8;color:var(--amber)} .v-unchecked{background:#f4f1ec;color:var(--dim)}
.btn{padding:8px 15px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid var(--line2);background:var(--surface)}
.btn:hover{background:var(--ground)} .btn.pri{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn.pri:hover{background:#2a2620} .btn.sm{padding:5px 10px;font-size:12px}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:default}
.drawer{position:fixed;inset:0;background:rgba(20,18,15,.34);display:flex;justify-content:flex-end;z-index:60}
.drawer .inner{width:min(660px,100%);background:var(--ground);height:100%;overflow-y:auto;border-left:1px solid var(--line)}
.dh{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:18px 24px;display:flex;justify-content:space-between;gap:14px;z-index:2}
.db{padding:22px 24px 70px}
.sec{margin-bottom:22px}
.sec h3{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-bottom:9px;font-weight:600}
.issue{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:8px}
.issue .txt{font-size:13.5px;font-weight:500;margin-bottom:5px}
.issue .ev{font-size:12px;color:var(--muted);line-height:1.5}
.vlinks a{display:block;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line);word-break:break-all;font-family:"JetBrains Mono",monospace}
.opener{background:#fff;border-left:3px solid var(--accent);border-radius:0 9px 9px 0;padding:13px 15px;font-size:13.5px;line-height:1.6}
.note{width:100%;min-height:74px;padding:10px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);resize:vertical;font-size:13px}
ul.li{list-style:none}
ul.li li{font-size:13px;padding:6px 0 6px 16px;position:relative;color:var(--body);line-height:1.5}
ul.li li:before{content:"";position:absolute;left:2px;top:13px;width:5px;height:5px;border-radius:50%;background:var(--grey)}
.kb{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:#f4f1ec;border:1px solid var(--line);border-radius:10px;padding:11px;min-height:170px}
.col h4{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:8px;cursor:pointer}
.card:hover{box-shadow:0 6px 18px rgba(20,18,15,.08)}
.card .cn{font-size:13px;font-weight:600;line-height:1.3}
.card .cm{font-size:10.5px;color:var(--dim);font-family:"JetBrains Mono",monospace;margin-top:4px}
.mv{display:flex;gap:4px;margin-top:8px}
.mv button{font-size:10.5px;padding:3px 7px;border-radius:5px;background:var(--ground);border:1px solid var(--line2);color:var(--muted)}
.mv button:hover{background:var(--ink);color:var(--ground)}
.form{display:grid;gap:10px;max-width:440px}
.form input,.form select{padding:9px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);font-size:13.5px;width:100%}
.form label{font-size:12px;color:var(--muted)}
.empty{padding:44px 20px;text-align:center;color:var(--dim);font-size:13.5px}
.banner{padding:11px 16px;border-radius:9px;font-size:13px;margin-bottom:18px;border:1px solid}
.b-warn{background:#fdf3e8;border-color:#f0dcc0;color:#7a5214}
.b-info{background:#eef2f8;border-color:#d8e2f0;color:#2f4d78}
.b-err{background:#fbeeea;border-color:#f0cfc4;color:#8f3a20}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:100px;font-size:12.5px;z-index:99;font-family:"JetBrains Mono",monospace;box-shadow:0 8px 24px rgba(20,18,15,.2)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.loginbox{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:30px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--grey);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:760px){.kb{grid-template-columns:repeat(6,minmax(150px,1fr))}.wrap{padding:0 16px}}
</style>
</head>
<body>
<div id="app"><div class="login"><div class="loginbox"><span class="spin"></span> loading…</div></div></div>

<script>
(function(){
"use strict";

/* ── config ────────────────────────────────────────────────────────────── */
var SB = "https://anppgukwdmgfmjnqindy.supabase.co";
var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFucHBndWt3ZG1nZm1qbnFpbmR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDQ4OTQsImV4cCI6MjEwMzc4MDg5NH0.ToHAeW5cmS2YuoXbw8eE1d-CD6SeoHnr3en1GaY0o3M";
/* The anon key is public by design. Every table has RLS pinned to one user id,
   so this key alone returns [] — verified before shipping. */

var STAGES = [["new","New"],["contacted","Contacted"],["booked","Booked"],
              ["proposal","Proposal"],["won","Won"],["lost","Lost"]];
var SESS_KEY = "fb_session";

/* ── state ─────────────────────────────────────────────────────────────── */
var sess = null, data = { audits:[], contacts:[], bookings:[], settings:{}, messages:[], templates:[] };
var ui = { tab:"leads", seg:"todo", open:null, f:{score:"",ind:"",ep:"",val:"",q:""}, err:"", busy:false };
var app = document.getElementById("app");

/* ── auth ──────────────────────────────────────────────────────────────── */
function loadSess(){
  try{ var s=JSON.parse(localStorage.getItem(SESS_KEY)||"null");
       if(s && s.access_token) return s; }catch(e){}
  return null;
}
function saveSess(s){
  sess=s;
  try{ localStorage.setItem(SESS_KEY, JSON.stringify(s)); }catch(e){}
}
function clearSess(){ sess=null; try{ localStorage.removeItem(SESS_KEY); }catch(e){} }

function signIn(email, pw){
  return fetch(SB+"/auth/v1/token?grant_type=password",{
    method:"POST", headers:{ "apikey":ANON, "Content-Type":"application/json" },
    body: JSON.stringify({ email:email, password:pw })
  }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(x){
      if(!x.ok || !x.j.access_token) throw new Error(x.j.error_description || x.j.msg || "Sign-in failed");
      x.j.expires_at = Date.now() + (x.j.expires_in||3600)*1000;
      saveSess(x.j); return x.j;
    });
}
function refresh(){
  if(!sess || !sess.refresh_token) return Promise.reject(new Error("no session"));
  return fetch(SB+"/auth/v1/token?grant_type=refresh_token",{
    method:"POST", headers:{ "apikey":ANON, "Content-Type":"application/json" },
    body: JSON.stringify({ refresh_token: sess.refresh_token })
  }).then(function(r){ return r.ok ? r.json() : Promise.reject(new Error("refresh failed")); })
    .then(function(j){ j.expires_at = Date.now()+(j.expires_in||3600)*1000; saveSess(j); return j; });
}

/* ── rest ──────────────────────────────────────────────────────────────── */
function api(path, opts){
  opts = opts || {};
  var go = function(){
    var h = { "apikey":ANON, "Authorization":"Bearer "+(sess?sess.access_token:ANON) };
    if(opts.body){ h["Content-Type"]="application/json"; h["Prefer"]=opts.prefer||"return=representation"; }
    else if(opts.prefer) h["Prefer"]=opts.prefer;
    return fetch(SB+"/rest/v1/"+path, {
      method: opts.method||"GET", headers:h,
      body: opts.body?JSON.stringify(opts.body):undefined
    });
  };
  var need = sess && sess.expires_at && sess.expires_at - Date.now() < 60000;
  return (need ? refresh().catch(function(){}) : Promise.resolve())
    .then(go)
    .then(function(r){
      if(r.status===401){
        return refresh().then(go).then(function(r2){ return handle(r2); });
      }
      return handle(r);
    });
  function handle(r){
    if(r.status===204) return null;
    return r.text().then(function(t){
      var j=null; try{ j=t?JSON.parse(t):null; }catch(e){ j=t; }
      if(!r.ok) throw new Error((j && (j.message||j.error_description)) || ("HTTP "+r.status));
      return j;
    });
  }
}

var SELECT = "id,score,score_rationale,funnel_path,endpoint_type,validation,validation_note,"+
  "call_opener,corrected_note,batch_label,discovery_query,draft_subject,draft_body,"+
  "business:businesses(id,slug,name,domain,industry,region,fb_page_url,phone,email,contact_source),"+
  "ad:ads(ad_library_id,permalink,running_since,ads_running,endpoint_type,destination_url),"+
  "issues(id,description,evidence,evidence_class,sort_order),"+
  "suggested_fixes(id,fix,sort_order),"+
  "open_questions(id,question,sort_order),"+
  "verify_links(id,label,url),"+
  "deals(id,stage,notes,next_action,next_action_due)";

function loadAll(){
  ui.busy = true;
  return Promise.all([
    api("audits?select="+encodeURIComponent(SELECT)+"&order=score.asc"),
    api("contacts?select=*&order=created_at.desc"),
    api("bookings?select=*,business:businesses(id,name,slug)&order=starts_at.desc"),
    api("settings?select=*"),
    api("messages?select=*&order=created_at.asc"),
    api("email_templates?select=*&order=sort_order.asc")
  ]).then(function(r){
    data.audits = r[0]||[];
    data.contacts = r[1]||[];
    data.bookings = r[2]||[];
    data.settings = {};
    (r[3]||[]).forEach(function(s){ data.settings[s.key]=s.value; });
    data.messages = r[4]||[];
    data.templates = r[5]||[];
    data.audits.forEach(function(a){
      (a.issues||[]).sort(function(x,y){return x.sort_order-y.sort_order;});
      (a.suggested_fixes||[]).sort(function(x,y){return x.sort_order-y.sort_order;});
      (a.open_questions||[]).sort(function(x,y){return x.sort_order-y.sort_order;});
    });
    ui.busy=false; ui.err="";
  }).catch(function(e){ ui.busy=false; ui.err=e.message; });
}

/* ── toast ─────────────────────────────────────────────────────────────── */
var toastEl=null, toastT=null;
function toast(msg, ms){
  if(!toastEl){ toastEl=document.createElement("div"); toastEl.className="toast"; document.body.appendChild(toastEl); }
  toastEl.textContent=msg; clearTimeout(toastT);
  if(ms!==0) toastT=setTimeout(function(){ if(toastEl){toastEl.remove(); toastEl=null;} }, ms||1600);
}
function clearToast(){ if(toastEl){toastEl.remove();toastEl=null;} clearTimeout(toastT); }

/* ── writes ────────────────────────────────────────────────────────────── */
function setValidation(a, v){
  var prev=a.validation; a.validation=v; render();
  toast("saving…",0);
  api("audits?id=eq."+a.id, {method:"PATCH", body:{validation:v, validated_at: v==="unchecked"?null:new Date().toISOString()}})
    .then(function(){ toast("saved"); })
    .catch(function(e){ a.validation=prev; render(); toast("failed: "+e.message, 3200); });
}
function setNote(a, txt){
  toast("saving…",0);
  api("audits?id=eq."+a.id,{method:"PATCH", body:{validation_note:txt||null}})
    .then(function(){ a.validation_note=txt; toast("note saved"); })
    .catch(function(e){ toast("failed: "+e.message,3200); });
}
function setStage(a, stage){
  var d = (a.deals||[])[0];
  toast("saving…",0);
  var p;
  if(!stage && d){
    p = api("deals?id=eq."+d.id,{method:"DELETE"}).then(function(){ a.deals=[]; });
  } else if(d){
    p = api("deals?id=eq."+d.id,{method:"PATCH", body:{stage:stage, updated_at:new Date().toISOString()}})
        .then(function(){ d.stage=stage; });
  } else {
    p = api("deals",{method:"POST", body:{
          venture:"funnel_discovery", business_id:a.business.id, audit_id:a.id,
          title:a.business.name+" — funnel fix", stage:stage }})
        .then(function(rows){ a.deals=[rows[0]]; });
  }
  p.then(function(){
      toast(stage?("moved to "+stage):"removed from pipeline");
      render();
    })
   .catch(function(e){ toast("failed: "+e.message,3200); });
}
function addContact(o){
  toast("saving…",0);
  return api("contacts",{method:"POST", body:o}).then(function(rows){
    data.contacts.unshift(rows[0]); toast("added"); render();
  }).catch(function(e){ toast("failed: "+e.message,3200); });
}
function delRow(table, id, arr){
  toast("removing…",0);
  return api(table+"?id=eq."+id,{method:"DELETE"}).then(function(){
    var i=arr.findIndex(function(x){return x.id===id;}); if(i>-1) arr.splice(i,1);
    toast("removed"); render();
  }).catch(function(e){ toast("failed: "+e.message,3200); });
}
function addBooking(o){
  toast("saving…",0);
  return api("bookings",{method:"POST", body:o}).then(function(rows){
    data.bookings.unshift(rows[0]); toast("logged"); render();
  }).catch(function(e){ toast("failed: "+e.message,3200); });
}
function fillTpl(txt, a){
  var b=a.business||{};
  var first=(b.name||"").split(/[\s,&]+/)[0]||"there";
  var finding=(a.issues&&a.issues.length)?a.issues[0].description:(a.score_rationale||"");
  return String(txt||"")
    .replace(/\{\{first_name\}\}/g, first)
    .replace(/\{\{business\}\}/g, b.name||"")
    .replace(/\{\{cal_link\}\}/g, (data.settings.cal_link||"").trim())
    .replace(/\{\{finding\}\}/g, finding)
    .replace(/\{\{phone\}\}/g, b.phone||"");
}
function openMail(to, subject, body){
  var href="mailto:"+encodeURIComponent(to||"")
    +"?subject="+encodeURIComponent(subject||"")
    +"&body="+encodeURIComponent(body||"");
  if(href.length>1900){
    copyText(body,"Body");
    toast("too long for one click — body copied, opening blank draft",4200);
    href="mailto:"+encodeURIComponent(to||"")+"?subject="+encodeURIComponent(subject||"");
  }
  window.location.href=href;
}
function msgsFor(a){
  var id=a.business&&a.business.id;
  return id ? data.messages.filter(function(m){ return m.business_id===id; }) : [];
}
function unreadCount(){
  return data.messages.filter(function(m){ return m.direction==="inbound"; }).length;
}
function sendSms(a, body){
  var to=a.business&&a.business.phone;
  if(!to){ toast("no phone on file",2600); return; }
  toast("sending…",0);
  var url=SB+"/functions/v1/sms-send";
  fetch(url,{ method:"POST",
    headers:{ "Content-Type":"application/json", "apikey":ANON,
              "Authorization":"Bearer "+(sess?sess.access_token:"") },
    body: JSON.stringify({ to: to, body: body, business_id: a.business.id })
  }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
    .then(function(x){
      if(!x.ok){ toast(x.j.error||"send failed",4000); return; }
      toast("sent"); return loadAll().then(render);
    })
    .catch(function(e){ toast("send failed: "+e.message,4000); });
}
function sendEmail(a, to, subject, body){
  var b=a.business||{};
  to=(to||b.email||"").trim();
  if(!to){ toast("no address to send to",2600); return; }
  if(!body || !body.trim()){ toast("body is empty",2600); return; }
  if(!confirm("Send to "+to+"?\n\nSubject: "+(subject||"(none)"))) return;
  toast("sending…",0);
  fetch(SB+"/functions/v1/gmail-send",{ method:"POST",
    headers:{ "Content-Type":"application/json", "apikey":ANON,
              "Authorization":"Bearer "+(sess?sess.access_token:"") },
    body: JSON.stringify({ to:to, subject:subject||"",
                           body: composeEmail({draft_body:body}),
                           business_id: b.id })
  }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
    .then(function(x){
      if(!x.ok){
        // The function returns the specific cause; showing only the
        // headline turned a nameable error into "it just failed".
        var msg=x.j.error||"send failed";
        if(x.j.google_error) msg+=" ("+x.j.google_error+")";
        if(x.j.likely_cause && x.j.likely_cause.indexOf("unrecog")<0) msg+=" — "+x.j.likely_cause;
        console.error("gmail-send failed:", x.j);
        toast(msg,9000); return; }
      if(x.j.logged===false) toast("sent — but logging failed, check the thread",5200);
      else toast("sent");
      // Sending is contact. Advance a lead that hasn't been moved yet, but
      // never walk a further-along deal (booked/won) backwards.
      if(!stageOf(a)) setStage(a, "contacted");
      return loadAll().then(render);
    })
    .catch(function(e){ toast("send failed: "+e.message,5200); });
}
function sigBlock(){
  var sig=(data.settings.email_sig||"").trim();
  var cal=(data.settings.cal_link||"").trim();
  var out=[];
  if(sig) out.push(sig);

  } else fallback();

    try{ document.execCommand("copy"); done(); }catch(e){ toast("copy failed",2600); }

/* ── helpers ───────────────────────────────────────────────────────────── */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function epTag(e){ e=e||"null"; return '<span class="tag t-'+esc(e)+'">'+esc(e.replace("_"," "))+'</span>'; }
function vTag(v){ v=v||"unchecked"; return '<span class="tag v-'+esc(v)+'">'+esc(v)+'</span>'; }
function stageOf(a){ var d=(a.deals||[])[0]; return d?d.stage:null; }
function gcal(b){
  if(!b.starts_at) return "";
  var st=new Date(b.starts_at); if(isNaN(st)) return "";
  var en=b.ends_at?new Date(b.ends_at):new Date(st.getTime()+30*60000);
  function z(d){ return d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""); }
  return "https://calendar.google.com/calendar/render?action=TEMPLATE"
    +"&text="+encodeURIComponent("Call — "+(b.attendee_name||""))
    +"&dates="+z(st)+"/"+z(en)
    +(b.attendee_email?"&add="+encodeURIComponent(b.attendee_email):"")
    +(b.meeting_url?"&location="+encodeURIComponent(b.meeting_url):"");
}
function csv(){
  var head=["business","score","vertical","region","endpoint","domain","phone","email","contact_source","ads_since","validation","stage","ad_permalink","call_opener","draft_subject","draft_body","rationale"];
  var rows=[head];
  data.audits.forEach(function(a){
    var b=a.business||{}, ad=a.ad||{};
    rows.push([b.name,a.score,b.industry,b.region,a.endpoint_type,b.domain,b.phone,b.email,
               b.contact_source,ad.running_since,a.validation,stageOf(a)||"",ad.permalink||"",
               a.call_opener,a.draft_subject,composeEmail(a),a.score_rationale]);
  });
  return rows.map(function(r){ return r.map(function(c){
    c=String(c==null?"":c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(","); }).join("\n");
}

  var h='<div class="head"><div><h1>Pipeline</h1><div class="sub">Promote from Leads · arrows move a card</div></div></div><div class="kb">';
  STAGES.forEach(function(s,idx){
    var items=data.audits.filter(function(a){return stageOf(a)===s[0];});
    h+='<div class="col"><h4><span>'+s[1]+'</span><span>'+items.length+'</span></h4>';
    items.forEach(function(a){
      h+='<div class="card" data-open="'+a.id+'"><div class="cn">'+esc(a.business.name)+'</div>'
        +'<div class="cm">score '+a.score+' · '+esc(a.business.industry||"")+'</div><div class="mv">'
        +(idx>0?'<button data-mv="'+a.id+'|'+STAGES[idx-1][0]+'">←</button>':"")
        +(idx<STAGES.length-1?'<button data-mv="'+a.id+'|'+STAGES[idx+1][0]+'">→</button>':"")
        +'</div></div>';
    });
    h+='</div>';
  });
  return h+'</div>';
}

function vContacts(){
  var h='<div class="head"><div><h1>Contacts</h1><div class="sub">'+data.contacts.length+' · business-published details only</div></div></div>';
  h+='<div class="panel" style="margin-bottom:20px"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th></th></tr></thead><tbody>';
  if(!data.contacts.length) h+='<tr><td colspan="5" class="empty">No contacts yet.</td></tr>';
  data.contacts.forEach(function(c){
    h+='<tr><td class="bn">'+esc(c.name)+'</td><td class="mono" style="font-size:12px">'+esc(c.email||"")+'</td>'
      +'<td class="mono" style="font-size:12px">'+esc(c.phone||"")+'</td><td>'+esc(c.role||"")+'</td>'
      +'<td style="text-align:right"><button class="btn sm" data-delc="'+c.id+'">Remove</button></td></tr>'; });
  h+='</tbody></table></div>';
  h+='<div class="panel" style="padding:18px"><h3 style="font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-bottom:11px">Add contact</h3>'
    +'<div class="form"><input id="cn" placeholder="Name"><input id="ce" placeholder="Email" type="email"><input id="cp" placeholder="Phone"><input id="cr" placeholder="Role">'
    +'<button class="btn pri" id="addc">Add contact</button></div></div>';
  return h;
}

function vBookings(){
  var cal=data.settings.cal_link||"";
  var h='<div class="head"><div><h1>Bookings</h1><div class="sub">'+data.bookings.length+' logged</div></div>'
    +(cal?'<a class="btn pri" href="'+esc(cal)+'" target="_blank" rel="noopener">Open booking page ↗</a>':"")+'</div>';
  if(!cal) h+='<div class="banner b-info">Add your Cal.com link below. Automatic sync via webhook is the next step now that there is a real database.</div>';
  h+='<div class="panel" style="margin-bottom:20px"><table><thead><tr><th>Who</th><th>Lead</th><th>When</th><th>Status</th><th></th></tr></thead><tbody>';
  if(!data.bookings.length) h+='<tr><td colspan="5" class="empty">No bookings yet. Once the Cal.com webhook is connected they land here automatically.</td></tr>';
  data.bookings.forEach(function(b){
    var g=gcal(b), past=b.starts_at && new Date(b.starts_at)<new Date();
    h+='<tr>'
      +'<td><div class="bn">'+esc(b.attendee_name||"—")+'</div>'
      +'<div class="bs">'+esc(b.attendee_email||b.attendee_phone||"")+'</div></td>'
      +'<td>'+(b.business?('<span class="tag t-form">'+esc(b.business.name)+'</span>')
                        :'<span style="color:var(--dim);font-size:12px">no match</span>')+'</td>'
      +'<td class="mono" style="font-size:12px">'+esc(b.starts_at?new Date(b.starts_at).toLocaleString():"")+'</td>'
      +'<td>'+(b.no_show?'<span class="tag v-disputed">no-show</span>'
              : b.status==="cancelled"?'<span class="tag v-unchecked">cancelled</span>'
              : '<span class="tag v-validated">'+esc(b.status)+'</span>')+'</td>'
      +'<td style="text-align:right;white-space:nowrap">'
      +(b.meeting_url?'<a class="btn sm" href="'+esc(b.meeting_url)+'" target="_blank" rel="noopener">Join</a> ':"")
      +(g?'<a class="btn sm" href="'+esc(g)+'" target="_blank" rel="noopener">Calendar</a> ':"")
      +(past && b.status!=="cancelled" ? '<button class="btn sm" data-noshow="'+b.id+'|'+(b.no_show?"0":"1")+'">'+(b.no_show?"Clear":"No-show")+'</button> ' : "")
      +'<button class="btn sm" data-delb="'+b.id+'">Remove</button></td></tr>'; });
  h+='</tbody></table></div>';
  h+='<div class="panel" style="padding:18px;margin-bottom:20px"><h3 style="font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-bottom:11px">Log a booking</h3>'
    +'<div class="form"><input id="bw" placeholder="Who"><input id="be" placeholder="Their email" type="email"><label>When</label><input id="bd" type="datetime-local"><input id="bm" placeholder="Meeting URL (optional)">'
    +'<div style="display:flex;gap:8px"><button class="btn pri" id="addb">Log booking</button><button class="btn" id="meetnew">New Google Meet</button></div></div></div>';
  h+='<div class="panel" style="padding:18px"><h3 style="font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-bottom:11px">Booking link &amp; email signature</h3>'
    +'<div class="form" style="max-width:520px"><label>Cal.com booking link</label>'
    +'<input id="cal" placeholder="https://cal.com/your-name/15min" value="'+esc(cal)+'">'
    +'<label>Email signature — appended to every draft</label>'
    +'<textarea class="note" id="sig" style="min-height:90px">'+esc(data.settings.email_sig||"")+'</textarea>'
    +'<button class="btn pri" id="savecal">Save</button></div>'
    +'<div style="font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6">Changing either updates every draft email at once — the signature is stored separately from the 18 bodies.</div></div>';
  return h;
}

function vLogin(msg){
  return '<div class="login"><div class="loginbox">'
    +'<div style="display:flex;align-items:center;gap:9px;margin-bottom:6px">'
    +'<svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="#b0492a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5c2.2 3 3.6 5 3.6 7a3.6 3.6 0 0 1-7.2 0c0-2 1.4-4 3.6-7z"/><path d="M3 15.5h14"/><path d="M3 18h5"/><path d="M12 18h5"/></svg>'
    +'<span class="disp" style="font-size:17px;font-weight:600">firebreak</span></div>'
    +'<div class="sub" style="margin-bottom:18px">Sign in to your CRM</div>'
    +(msg?'<div class="banner b-err">'+esc(msg)+'</div>':"")
    +'<div class="form" style="max-width:none"><input id="li_e" type="email" placeholder="Email" autocomplete="username">'
    +'<input id="li_p" type="password" placeholder="Password" autocomplete="current-password">'
    +'<button class="btn pri" id="li_go">Sign in</button></div></div></div>';
}

function render(){
  if(!sess) { app.innerHTML = vLogin(ui.err); var e=document.getElementById("li_e"); if(e) e.focus(); return; }
  var tabs=[["overview","Overview"],["leads","Leads"],["pipeline","Pipeline"],["contacts","Contacts"],["bookings","Bookings"]];
  var h='<header><div class="wrap"><div class="bar">'
    +'<div class="brand"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="#b0492a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5c2.2 3 3.6 5 3.6 7a3.6 3.6 0 0 1-7.2 0c0-2 1.4-4 3.6-7z"/><path d="M3 15.5h14"/><path d="M3 18h5"/><path d="M12 18h5"/></svg><span class="disp">firebreak</span></div>'
    +'<nav>'+tabs.map(function(t){return '<button data-tab="'+t[0]+'" class="'+(ui.tab===t[0]?"on":"")+'">'+t[1]+'</button>';}).join("")+'</nav>'
    +'<div style="display:flex;gap:8px;align-items:center"><span class="pill mono">supabase</span>'
    +'<button class="btn sm" id="signout">Sign out</button></div>'
    +'</div></div></header><main><div class="wrap">';
  if(ui.err) h+='<div class="banner b-err">'+esc(ui.err)+' <button class="btn sm" id="retry" style="margin-left:8px">Retry</button></div>';
  if(ui.busy) h+='<div class="banner b-info"><span class="spin"></span> loading…</div>';
  h+= ui.tab==="overview"?vOverview(): ui.tab==="leads"?vLeads(): ui.tab==="pipeline"?vPipeline():
      ui.tab==="contacts"?vContacts(): vBookings();
  h+='</div></main>'+vDrawer();
  app.innerHTML=h;
}

/* ── events ────────────────────────────────────────────────────────────── */
function auditById(id){ var r=null; data.audits.forEach(function(a){ if(a.id===id) r=a; }); return r; }
function val(id){ var e=document.getElementById(id); return e?e.value.trim():""; }

document.addEventListener("click",function(e){
  if(e.target.id==="li_go"){ doLogin(); return; }
  if(e.target.id==="signout"){ clearSess(); ui.err=""; render(); return; }
  if(e.target.id==="retry"){ ui.err=""; render(); loadAll().then(render); return; }
  /* SPECIFIC ACTIONS BEFORE CLOSE — the drawer overlay would otherwise swallow them */
  var v=e.target.closest("[data-val]");   if(v){ setValidation(auditById(ui.open), v.dataset.val); return; }
  var s=e.target.closest("[data-stage]"); if(s){ setStage(auditById(ui.open), s.dataset.stage||null); return; }
  if(e.target.id==="savenote"){ setNote(auditById(ui.open), val("note")); return; }
  if(e.target.id==="qs_open"){ var A=auditById(ui.open);
      openMail(val("qs_to"), val("qs_subj"), val("qs_body")+"\n\n"+sigBlock()); return; }
  if(e.target.id==="qs_copy"){ copyText(val("qs_body")+"\n\n"+sigBlock(), "Email"); return; }
  if(e.target.id==="qs_log"){ var A2=auditById(ui.open);
      api("activities",{method:"POST", body:{ business_id:A2.business.id, kind:"email_sent",
        actor:"hassan", body:"Sent: "+(val("qs_subj")||"(no subject)")+" -> "+(val("qs_to")||"?") }})
        .then(function(){ toast("logged"); })
        .catch(function(er){ toast("failed: "+er.message,3200); });
      return; }
  if(e.target.id==="sms_send"){ var body=val("sms_body");
      if(body) sendSms(auditById(ui.open), body); return; }
  if(e.target.id==="qs_send"){
      sendEmail(auditById(ui.open), val("qs_to"), val("qs_subj"), val("qs_body")); return; }
  if(e.target.id==="qs_save"){
      saveDraft(auditById(ui.open), val("qs_subj"), val("qs_body")); return; }
  if(e.target.id==="savebiz"){ saveBusiness(auditById(ui.open), {
      name: val("eb_name")||null, domain: val("eb_domain")||null,
      phone: val("eb_phone")||null, email: val("eb_email")||null }); return; }
  if(e.target.id==="dellead"){ deleteLead(auditById(ui.open)); return; }
  var sg=e.target.closest("[data-seg]"); if(sg){ ui.seg=sg.dataset.seg; render(); return; }
  var t=e.target.closest("[data-tab]");   if(t){ ui.tab=t.dataset.tab; ui.open=null; render(); return; }
  var cb=e.target.closest("button[data-close]"); if(cb){ ui.open=null; render(); return; }
  if(e.target.classList && e.target.classList.contains("drawer")){ ui.open=null; render(); return; }
  var mv=e.target.closest("[data-mv]");   if(mv){ var p=mv.dataset.mv.split("|"); setStage(auditById(p[0]), p[1]); return; }
  var o=e.target.closest("[data-open]");  if(o){ ui.open=o.dataset.open; render(); return; }
  if(e.target.id==="csv"){ downloadCsv(); return; }
  if(e.target.id==="addc"){ var n=val("cn"); if(!n) return;
    addContact({name:n,email:val("ce")||null,phone:val("cp")||null,role:val("cr")||null}); return; }
  var dc=e.target.closest("[data-delc]"); if(dc){ delRow("contacts",dc.dataset.delc,data.contacts); return; }
  if(e.target.id==="meetnew"){ window.open("https://meet.google.com/new","_blank","noopener"); return; }
  if(e.target.id==="addb"){ var w=val("bw"); if(!w) return;
    addBooking({provider:"manual",attendee_name:w,attendee_email:val("be")||null,
      starts_at: val("bd")?new Date(val("bd")).toISOString():null,
      meeting_url: val("bm")||null, status:"active"}); return; }
  var ns=e.target.closest("[data-noshow]");
  if(ns){ var q=ns.dataset.noshow.split("|");
    var bk=data.bookings.filter(function(x){return x.id===q[0];})[0];
    if(bk) setNoShow(bk, q[1]==="1"); return; }
  var db=e.target.closest("[data-delb]"); if(db){ delRow("bookings",db.dataset.delb,data.bookings); return; }
  if(e.target.id==="savecal"){
      var sg=val("sig");
      saveSetting("cal_link", val("cal")).then(function(){ return saveSetting("email_sig", sg); });
      return; }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter" && (e.target.id==="li_e"||e.target.id==="li_p")) doLogin();
  if(e.key==="Escape" && ui.open){ ui.open=null; render(); }
});
document.addEventListener("change",function(e){
  var f=e.target.closest("[data-f]"); if(f){ ui.f[f.dataset.f]=e.target.value; render(); }
  if(e.target.id==="qs_tpl"){
    var a=auditById(ui.open); if(!a) return;
    var v=e.target.value, subj="", body="";
    if(v==="draft"){ subj=a.draft_subject||""; body=a.draft_body||""; }
    else if(v!==""){ var t=data.templates[+v]; if(t){ subj=fillTpl(t.subject,a); body=fillTpl(t.body,a); } }
    var S=document.getElementById("qs_subj"), B=document.getElementById("qs_body");
    if(S) S.value=subj;
    if(B) B.value=body;
  }
});
document.addEventListener("input",function(e){
  if(e.target.id==="q"){ ui.f.q=e.target.value; var p=e.target.selectionStart; render();
    var q=document.getElementById("q"); if(q){ q.focus(); try{q.setSelectionRange(p,p);}catch(_){ } } }
});

function doLogin(){
  var em=val("li_e"), pw=val("li_p");
  if(!em||!pw){ ui.err="Email and password required"; render(); return; }
  toast("signing in…",0);
  signIn(em,pw).then(function(){ ui.err=""; clearToast(); render(); return loadAll(); })
    .then(render)
    .catch(function(e){ clearToast(); ui.err=e.message; render(); });
}
function downloadCsv(){
  var blob=new Blob([csv()],{type:"text/csv"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="firebreak-leads.csv";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },0);
}

/* ── boot ──────────────────────────────────────────────────────────────── */
sess = loadSess();
if(sess){ render(); loadAll().then(render); }
else render();
})();
</script>
</body>
</html>
